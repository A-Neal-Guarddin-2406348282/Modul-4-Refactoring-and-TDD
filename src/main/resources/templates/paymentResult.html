<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Payment Result')"></head>
<body>
<div th:replace="fragments/layout :: navbar"></div>

<div class="container my-4">
    <div class="card">
        <div class="card-body p-4">
            <h3 class="mb-3">Payment Submitted</h3>

            <p><strong>Payment ID:</strong> <span id="paymentResultIdText" th:text="${payment.id}"></span></p>
            <p><strong>Payment Status:</strong> <span th:text="${payment.status}"></span></p>
            <p><strong>Order Status:</strong> <span th:text="${order.status}"></span></p>

            <div class="d-flex gap-2">
                <a class="btn btn-primary" th:href="@{/payment/detail/{id}(id=${payment.id})}">See Payment Detail</a>
                <a class="btn btn-outline-secondary" th:href="@{/payment/admin/list}">Admin List</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
